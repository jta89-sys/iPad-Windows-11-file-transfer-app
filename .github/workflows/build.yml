name: Build iPad IPA (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipad-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show build tools
        run: xcodebuild -version
      - name: Test file copying
        run: |
          mkdir -p build
          swiftc App/FileOperations.swift Tests/FileOperationsTests.swift -o build/file-tests
          build/file-tests
      - name: Build for iPad
        run: |
          set -o pipefail
          xcodebuild -project FileBridge.xcodeproj -scheme FileBridge \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build/xcodebuild.log
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/FileBridge.app build/package/Payload/
          cd build/package
          zip -qr ../FileBridge-unsigned.ipa Payload
          cd ../..
          python3 scripts/verify_ipa.py build/FileBridge-unsigned.ipa
          shasum -a 256 build/FileBridge-unsigned.ipa > build/SHA256.txt
          echo '### File Bridge build' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download FileBridge-unsigned from Artifacts below. This IPA is unsigned and must be signed before installation on iPad.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FileBridge-unsigned
          path: |
            build/FileBridge-unsigned.ipa
            build/SHA256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
